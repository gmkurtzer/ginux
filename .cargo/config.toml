# One target triple, one architecture. The same freestanding link applies to
# whichever architecture the daemon is built for. Target-only flags also
# affect host build scripts when the host matches that triple.
[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "linker=rust-lld",
    "-C", "link-arg=-nostdlib",
    "-C", "link-arg=-static",
    "-C", "link-arg=-no-pie",
    "-C", "relocation-model=static",
]

[target.aarch64-unknown-linux-gnu]
rustflags = [
    "-C", "linker=rust-lld",
    "-C", "link-arg=-nostdlib",
    "-C", "link-arg=-static",
    "-C", "link-arg=-no-pie",
    "-C", "relocation-model=static",
]

