<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
<title id="title">Ginux allocator throughput relative to native</title>
<desc id="desc">Grouped bars compare native and Ginux allocator throughput at one, two, and four threads.</desc>
<rect width="760" height="300" fill="#ffffff"/>
<line x1="70" y1="240" x2="730" y2="240" stroke="#334155"/>
<rect x="130" y="90" width="45" height="150" fill="#64748b"/>
<rect x="180" y="50" width="45" height="190" fill="#c2410c"/>
<rect x="230" y="50" width="45" height="190" fill="#0f766e"/>
<text x="190" y="265" text-anchor="middle" font-family="sans-serif" font-size="14">1 threads</text>
<text x="202" y="42" text-anchor="middle" font-family="sans-serif" font-size="11">4.304x</text>
<text x="252" y="42" text-anchor="middle" font-family="sans-serif" font-size="11">2.298x</text>
<rect x="340" y="90" width="45" height="150" fill="#64748b"/>
<rect x="390" y="50" width="45" height="190" fill="#c2410c"/>
<rect x="440" y="50" width="45" height="190" fill="#0f766e"/>
<text x="400" y="265" text-anchor="middle" font-family="sans-serif" font-size="14">2 threads</text>
<text x="412" y="42" text-anchor="middle" font-family="sans-serif" font-size="11">4.725x</text>
<text x="462" y="42" text-anchor="middle" font-family="sans-serif" font-size="11">2.150x</text>
<rect x="550" y="90" width="45" height="150" fill="#64748b"/>
<rect x="600" y="50" width="45" height="190" fill="#c2410c"/>
<rect x="650" y="50" width="45" height="190" fill="#0f766e"/>
<text x="610" y="265" text-anchor="middle" font-family="sans-serif" font-size="14">4 threads</text>
<text x="622" y="42" text-anchor="middle" font-family="sans-serif" font-size="11">4.144x</text>
<text x="672" y="42" text-anchor="middle" font-family="sans-serif" font-size="11">1.700x</text>
<rect x="70" y="20" width="18" height="18" fill="#64748b"/><text x="96" y="34" font-family="sans-serif" font-size="14">native</text>
<rect x="180" y="20" width="18" height="18" fill="#c2410c"/><text x="206" y="34" font-family="sans-serif" font-size="14">jemalloc</text>
<rect x="290" y="20" width="18" height="18" fill="#0f766e"/><text x="316" y="34" font-family="sans-serif" font-size="14">ginux-guarded</text>
</svg>
