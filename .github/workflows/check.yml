name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update
      - run: sudo apt-get install --yes ripgrep
      - run: rustup target add x86_64-unknown-uefi x86_64-unknown-none
      - run: make check

  qemu:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - run: brew install qemu
      - run: rustup target add x86_64-unknown-uefi x86_64-unknown-none
      - run: make test
        env:
          GINUX_BOOT_TIMEOUT_SECONDS: 300
