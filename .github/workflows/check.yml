name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update
      - run: sudo apt-get install --yes ripgrep
      - run: rustup target add x86_64-unknown-uefi x86_64-unknown-none
      - run: make check

  qemu:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - run: brew install qemu
      - run: rustup target add x86_64-unknown-uefi x86_64-unknown-none
      - name: QEMU boot smoke test
        if: github.event_name == 'pull_request'
        run: make test-qemu-smoke
        env:
          GINUX_BOOT_TIMEOUT_SECONDS: 180
      - name: QEMU EFI load above 4 GiB test
        run: make test-efi-load-above-4g
        env:
          GINUX_BOOT_TIMEOUT_SECONDS: 180
      - name: Full QEMU integration test
        if: github.event_name == 'push'
        run: make test
        env:
          GINUX_BOOT_TIMEOUT_SECONDS: 300
