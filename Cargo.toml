[workspace]
members = [
    "crates/baseline-runner",
    "crates/ginux-core",
    "crates/ginux-contract",
    "crates/ginux-cli",
    "crates/ginux-instance",
    "crates/ginux-devices",
    "crates/ginux-fs-policy",
    "crates/ginux-init",
    "crates/ginux-kernel-views",
    "crates/ginux-oci",
    "crates/ginux-process",
    "crates/ginux-runtime",
    "crates/ginux-vfs",
    "crates/ginux-vfs-index",
    "crates/managed-payload",
    "crates/process-native-fixture",
    "crates/runtime-fixture",
    "crates/security-fuzzer",
]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
overflow-checks = true
panic = "abort"
strip = true
