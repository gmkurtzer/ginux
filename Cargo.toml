[workspace]
members = [
    "boot/efi",
    "crates/native-abi",
    "crates/volume-format",
    "crates/volume-service",
    "kernel",
    "services/network",
    "services/protocol",
    "services/volume",
    "tools/manifest-tool",
]
resolver = "2"

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
