[workspace]
members = [
    "crates/baseline-runner",
    "crates/ginus-core",
    "crates/ginus-domain",
    "crates/ginus-devices",
    "crates/ginus-init",
    "crates/ginus-process",
    "crates/ginus-runtime",
    "crates/ginus-vfs",
    "crates/ginus-vfs-index",
    "crates/managed-payload",
    "crates/process-native-fixture",
    "crates/runtime-fixture",
]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
