schema_version = 1

[instance]
id = "gate4-host-path"
root = "/var/lib/ginux/root"
init = "/runtime-fixture"
args = ["fixture-arg"]
environment = ["GINUX_GATE=4"]

[resources]
vcpus = 1
memory_mib = 128

[execution]
profile = "security"
backend = "interpreter"

[contract]
version = 1
catalog = 2
default = "deny"
allow = []
deny = []

[contract.syscalls]
control = "selective"
default = "deny"
allow = ["getpid", "getppid", "gettid", "write", "exit", "exit_group"]
deny = []

[storage]
assignments = []

[devices]
assignments = []

[network]
backend = "none"

[audit]
enabled = true

[failure]
policy = "stop"
