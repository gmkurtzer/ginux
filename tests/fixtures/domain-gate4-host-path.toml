schema_version = 1

[domain]
id = "gate4-host-path"
root = "/var/lib/ginus/root"
init = "/runtime-fixture"
args = ["fixture-arg"]
environment = ["GINUS_GATE=4"]

[resources]
vcpus = 1
memory_mib = 128

[execution]
profile = "security"
backend = "interpreter"

[contract]
profile = "gate4-static"

[storage]
assignments = []

[devices]
assignments = []

[network]
backend = "none"

[audit]
mode = "stderr"

[failure]
policy = "stop"
