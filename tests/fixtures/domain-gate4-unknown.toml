schema_version = 1

[domain]
id = "gate4-demo"
root = "rocky-10.2-x86_64"
init = "/runtime-fixture"
args = ["fixture-arg"]
environment = ["GINUX_GATE=4"]
host_path = "/etc"

[resources]
vcpus = 1
memory_mib = 128

[execution]
profile = "security"
backend = "interpreter"

[contract]
profile = "gate4-static"

[storage]
assignments = []

[devices]
assignments = []

[network]
backend = "none"

[audit]
mode = "stderr"

[failure]
policy = "stop"
