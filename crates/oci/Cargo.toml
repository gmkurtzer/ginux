[package]
name = "ginux-oci"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[features]
default = ["sha256"]
sha256 = ["dep:sha2"]

[dependencies]
heapless = { version = "=0.9.2", features = ["serde"] }
serde = { version = "=1.0.228", default-features = false, features = ["derive"] }
serde-json-core = { version = "=0.7.0", default-features = false, features = ["heapless"] }
sha2 = { version = "=0.11.0", default-features = false, optional = true }
