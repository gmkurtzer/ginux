# High-inspection shell. Every syscall is mediated in userspace, trading
# performance for complete syscall visibility and control.
schema_version = 1

[instance]
id = "paranoid-shell"
root = "docker.io/rockylinux/rockylinux@sha256:7a18ce2c9c1e0d8735f3e72685f9666150af25036e7f7b5ee4eede3754496f8c"
init = "/bin/bash"
args = ["--noprofile", "--norc"]
environment = ["HOME=/root", "TERM=xterm-256color"]

[identity]
hostname = "ginux-paranoid"

[resources]
vcpus = 1
memory_mib = 1024

[execution]
profile = "balanced"
backend = "ptrace-native"

[contract]
version = 1
catalog = 2
default = "deny"
allow = ["*"]
deny = ["device.mmio.direct", "device.dma.direct", "network.packet.raw"]

[contract.syscalls]
control = "paranoid"
default = "deny"
allow = ["*"]
deny = []

[contract.filesystem]
default = "deny"
read = ["/"]
write = ["/root", "/tmp"]
create = ["/root", "/tmp"]
deny = ["/boot", "/etc", "/usr"]

[contract.network]
default = "deny"
inbound = []
outbound = []

[contract.devices]
default = "deny"
read = ["/dev/console", "/dev/tty", "/dev/null", "/dev/zero", "/dev/random", "/dev/urandom"]
write = ["/dev/console", "/dev/tty", "/dev/null", "/dev/zero"]
create = []

[contract.privileges]
default = "deny"
setuid = []
setgid = []

[contract.process]
default = "deny"
max_processes = 128
max_threads = 256
signals = ["*"]
ptrace = "deny"
namespace_create = []
namespace_join = []

[contract.kernel]
default = "deny"
proc_read = ["/"]
proc_write = []
sys_read = ["/"]
sys_write = []

[storage]
assignments = ["root-overlay"]

[devices]
assignments = ["console", "null", "zero", "random"]

[hooks]
pre_boot = []
timeout_seconds = 10
failure = "stop"

[audit]
enabled = true

[failure]
policy = "stop"
