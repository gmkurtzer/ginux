schema_version = 1

[instance]
id = "gate975-network"
root = "docker.io/rockylinux/rockylinux@sha256:7a18ce2c9c1e0d8735f3e72685f9666150af25036e7f7b5ee4eede3754496f8c"
init = "/sbin/init"
args = ["--system", "--unit=multi-user.target"]
environment = ["container=ginux"]

[identity]
hostname = "gate975-network"

[resources]
vcpus = 2
memory_mib = 1024

[execution]
profile = "balanced"
backend = "ptrace-native"

[contract]
profile = "gate9-systemd-v1"

[storage]
assignments = ["root-overlay"]

[devices]
assignments = ["console", "null", "zero", "random", "net0"]

[network]
backend = "shared"
interface = "lo"
source = "127.0.0.1"
ingress_allow = ["tcp:18080"]
ingress_deny = ["tcp:18082"]
egress_allow = ["tcp:18081"]
egress_deny = ["tcp:25"]
port_forwards = ["tcp/lo/18081/18080"]

[audit]
mode = "stderr"

[failure]
policy = "stop"
