schema_version = 1

[instance]
id = "gate6-demo"
root = "docker.io/rockylinux/rockylinux@sha256:e372170ca8630f0f03e9b70fdd0bf4a3ce3426b0de7cdba615f06337389de176"
init = "/bin/bash"
args = []
environment = ["container=ginux"]

[resources]
vcpus = 1
memory_mib = 256

[execution]
profile = "balanced"
backend = "ptrace-native"

[contract]
version = 1
catalog = 2
default = "deny"
allow = []
deny = []

[contract.syscalls]
control = "selective"
default = "deny"
allow = ["getpid", "getppid", "gettid", "write", "exit", "exit_group"]
deny = []

[storage]
assignments = ["block0"]

[devices]
assignments = ["console", "null", "zero", "random", "block0", "net0"]

[network]
backend = "mediated"

[audit]
enabled = true

[failure]
policy = "stop"
