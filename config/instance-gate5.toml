schema_version = 1

[instance]
id = "gate5-demo"
root = "docker.io/rockylinux/rockylinux@sha256:e372170ca8630f0f03e9b70fdd0bf4a3ce3426b0de7cdba615f06337389de176"
init = "/bin/bash"
args = []
environment = ["container=ginux"]

[resources]
vcpus = 1
memory_mib = 256

[execution]
profile = "balanced"
backend = "ptrace-native"

[contract]
version = 1
catalog = 2
default = "deny"
allow = ["*"]
deny = ["device.mmio.direct", "device.dma.direct", "network.packet.raw"]

[contract.syscalls]
control = "paranoid"
default = "deny"
allow = ["*"]
deny = []

[storage]
assignments = []

[devices]
assignments = []

[network]
backend = "none"

[audit]
mode = "stderr"

[failure]
policy = "stop"
