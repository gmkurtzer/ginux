schema_version = 1

[instance]
id = "rocky"
root = "docker.io/rockylinux/rockylinux@sha256:7a18ce2c9c1e0d8735f3e72685f9666150af25036e7f7b5ee4eede3754496f8c"
init = "/sbin/init"
args = ["--system", "--unit=multi-user.target"]
environment = ["container=ginux"]

[resources]
vcpus = 2
memory_mib = 1024

[execution]
profile = "balanced"
backend = "ptrace-native"

[userspace.contract]
version = 1
catalog = 1
default = "deny"
read = ["**"]
write = ["**"]
execute = ["**"]
connect = ["**"]
listen = ["**"]
process = ["**"]
system = ["**"]
deny = ["dev.mmio.direct", "dev.dma.direct", "network.packet.raw"]
exact_allow = []
exact_deny = []

[storage]
assignments = ["root-overlay"]

[devices]
assignments = ["console", "null", "zero", "random", "net0"]

[network]
backend = "shared"

[audit]
mode = "stderr"

[failure]
policy = "stop"
