[package]
name = "ginux-fuzz"
version = "0.0.0"
publish = false
license = "Apache-2.0"
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
# In-repo path dependencies: the harnesses exercise the parser crates exactly
# as the kernel consumes them. ginux-oci drops default features and re-adds
# "sha256" explicitly (the kernel-faithful feature set; see crates/oci
# `default = ["sha256"]`).
ginux-oci = { path = "../crates/oci", default-features = false, features = ["sha256"] }
ginux-protocol-state = { path = "../crates/protocol-state" }
ginux-volume-format = { path = "../crates/volume-format" }

# Pinned to the exact version used in the verification runs recorded on
# issue #58 (cargo-fuzz 0.13.2; see fuzz/README.md).
libfuzzer-sys = "=0.4.13"

# Standalone workspace: this crate is deliberately NOT a member of the root
# workspace. Upstream crates resolve `license.workspace = true` against the
# root manifest; keeping fuzz/ out of it leaves every root manifest untouched.
[workspace]

[[bin]]
name = "oci_surfaces"
path = "fuzz_targets/oci_surfaces.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_surfaces"
path = "fuzz_targets/protocol_surfaces.rs"
test = false
doc = false
bench = false

[[bin]]
name = "volume_surfaces"
path = "fuzz_targets/volume_surfaces.rs"
test = false
doc = false
bench = false
